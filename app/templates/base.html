<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit — Dashboard</title>
  <style>
    :root { --color-fondo: #0f172a; --color-tarjeta: #1e293b; --color-texto: #e2e8f0;
            --color-mutado: #94a3b8; --color-acento: #38bdf8; --color-alerta: #f87171;
            --color-ok: #4ade80; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--color-fondo);
           color: var(--color-texto); }
    header { padding: 0.75rem 1rem; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center;
             border-bottom: 1px solid #334155; }
    header h1 { font-size: 1.1rem; margin: 0; margin-right: auto; }
    nav { display: flex; flex-wrap: wrap; gap: 0.25rem; }
    nav a { color: var(--color-mutado); text-decoration: none; padding: 0.35rem 0.7rem;
            border-radius: 0.375rem; }
    nav a[aria-current="page"] { color: var(--color-acento); background: #0ea5e933; }
    main { padding: 1rem; max-width: 72rem; margin: 0 auto; }
    .tarjeta { background: var(--color-tarjeta); border-radius: 0.5rem; padding: 0.9rem; margin-bottom: 1rem;
               overflow-x: auto; }
    h2 { font-size: 1rem; margin: 0 0 0.6rem; }
    table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
    th, td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid #334155; white-space: nowrap; }
    th { color: var(--color-mutado); font-weight: 500; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .mutado { color: var(--color-mutado); }
    .alerta { color: var(--color-alerta); }
    .ok { color: var(--color-ok); }
    .chip { display: inline-block; padding: 0.1rem 0.45rem; border-radius: 0.3rem; font-size: 0.75rem;
            background: #334155; color: var(--color-mutado); }
    .chip-inmaduro { background: #b4530922; color: #fbbf24; }
    .chip-sinventas { background: #dc262622; color: var(--color-alerta); }
    canvas { max-width: 100%; }
    .graficas { display: grid; grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr)); gap: 1rem; }
    .grafica { background: var(--color-tarjeta); border-radius: 0.5rem; padding: 0.9rem; }
    @media (max-width: 40rem) { header h1 { width: 100%; } main { padding: 0.5rem; } }
  </style>
</head>
<body data-pantalla="{{ pantalla }}">
  <header>
    <h1>Orbit — Dashboard</h1>
    <nav>
      <a href="/" {% if pantalla == "resumen" %}aria-current="page"{% endif %}>Resumen</a>
      <a href="/campanas" {% if pantalla == "campanas" %}aria-current="page"{% endif %}>Campanas</a>
      <a href="/decisiones" {% if pantalla == "decisiones" %}aria-current="page"{% endif %}>Decisiones</a>
      <a href="/salud" {% if pantalla == "salud" %}aria-current="page"{% endif %}>Salud</a>
    </nav>
  </header>
  <main>
    {% block contenido %}{% endblock %}
  </main>
  <script src="/static/vendor/chart.umd.min.js"></script>
  <script>
    "use strict";
    // Decision 7 del header: el dinero viaja como STRING desde la API
    // ("363.1400"); el cliente lo parsea con Number() para graficar. El
    // backend jamas emite floats de dinero.
    function numero(s) {
      if (s === null || s === undefined || s === "") return null;
      return Number(s);
    }
    function datosDe(id) {
      var el = document.getElementById(id);
      if (!el) return null;
      return JSON.parse(el.textContent);
    }
    // Grafica de lineas (spend/revenue/ACoS): el dinero string se parsea
    // con numero(); un hueco (null) jamas se pinta como 0 (regla 3).
    function graficarSeries(canvasId, datosId, seriesClaves, etiquetas) {
      var canvas = document.getElementById(canvasId);
      if (!canvas) return;
      var datos = datosDe(datosId);
      if (!datos) return;
      var fechas = [];
      var columnas = {};
      seriesClaves.forEach(function (clave) { columnas[clave] = []; });
      (datos.series || []).forEach(function (fila) {
        fechas.push(fila.fecha);
        seriesClaves.forEach(function (clave) {
          columnas[clave].push(numero(fila[clave]));
        });
      });
      new Chart(canvas, {
        type: "line",
        data: { labels: fechas, datasets: etiquetas.map(function (etiqueta, i) {
          return { label: etiqueta, data: columnas[seriesClaves[i]], borderWidth: 1.5, spanGaps: false };
        }) },
        options: { responsive: true, plugins: { legend: { labels: { color: "#e2e8f0" } } },
                   scales: { x: { ticks: { color: "#94a3b8", maxTicksLimit: 8 } },
                             y: { ticks: { color: "#94a3b8" } } } }
      });
    }
    // Grafica de barras (skips, decisiones por kind).
    function graficarBarras(canvasId, etiquetas, valores, color) {
      var canvas = document.getElementById(canvasId);
      if (!canvas) return;
      new Chart(canvas, {
        type: "bar",
        data: { labels: etiquetas, datasets: [{ label: "conteo", data: valores, backgroundColor: color }] },
        options: { responsive: true, plugins: { legend: { display: false } },
                   scales: { x: { ticks: { color: "#94a3b8" } }, y: { ticks: { color: "#94a3b8" } } } }
      });
    }
    // Cursor del feed: la pagina siguiente pide id < next_cursor (decision 8).
    function cargarMas() {
      var boton = document.getElementById("btn-mas");
      if (!boton) return;
      var cursor = boton.dataset.cursor;
      window.location.href = "/decisiones?cursor=" + encodeURIComponent(cursor);
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
