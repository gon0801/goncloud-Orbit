# Generado por quality-kit (init-repo.ps1). Corre los mismos candados que
# ya corren en tu maquina (pre-commit) mas las pruebas, en la nube, en cada
# push y en cada pull request -- asi el repo queda protegido aunque alguien
# (vos, otra IA, un colaborador) haga un commit sin pasar por los candados
# locales, o desde una maquina que no los tiene instalados.
name: Quality

on:
  push:
    branches: [main, master]
  pull_request:
    # Ahorro CI (2026-09, pedido del dueno): en borrador la bateria espera;
    # arranca sola al marcar listo para revision (ready_for_review), al
    # etiquetar (labeled) o al salir de borrador (converted_to_draft).
    types: [opened, synchronize, reopened, ready_for_review, labeled, converted_to_draft]

# Ahorro CI: si llega un push nuevo sobre la misma rama o PR, la corrida
# anterior se cancela sola y solo la ULTIMA corre la bateria. Lo cancelado
# nunca deja un verde falso: el gate es fail-closed ante cancelaciones.
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  quality:
    # Ahorro CI: en PR borrador este job NO corre (el gate lo da por
    # pendiente); corre solo al marcar listo para revision. Push a main/master:
    # no hay borrador.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    services:
      # Postgres 16 desechable para test_migracion_rechaza_en_vivo: sin este
      # servicio el test skipea en CI y los rechazos en vivo nunca corren
      # (hallazgo CodeRabbit, PR #1). Mismas credenciales que docker-compose.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          # historia completa: el candado de frescura del contexto de chat
          # necesita el merge-base contra la rama base del PR
          fetch-depth: 0

      - name: Set up Python
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Python dependencies
        if: hashFiles('requirements.txt') != ''
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Candado de frescura del contexto de chat (solo PRs)
        # guardrails-01 task 1.4: un PR que marca tareas completadas en un
        # plan debe actualizar docs/CHAT-CONTEXT.md (lo lee el Project de
        # Claude Chat del dueno). El candado revisa, jamas escribe.
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "$GITHUB_BASE_REF"
          python tools/check_chat_context_fresh.py "origin/$GITHUB_BASE_REF"

      - name: Run pre-commit (todos los candados locales, sobre todo el repo)
        uses: pre-commit/action@v3.0.1

      - name: Run Python tests
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        env:
          ORBIT_TEST_DSN: postgresql://orbit:orbit@localhost:5432/postgres
        run: |
          pip install fastapi "psycopg[binary]" pytest httpx pglast jinja2
          PYTHONPATH=. pytest -q

      - name: Run Node tests
        if: hashFiles('package.json') != ''
        run: npm test --if-present

      - name: Verificar dashboard con el harness real
        env:
          ORBIT_TEST_DSN: postgresql://orbit:orbit@localhost:5432/postgres
        run: |
          pip install "uvicorn[standard]>=0.30"
          python -m venv --system-site-packages .venv
          .venv/bin/python .cursor/skills/verify-orbit/helpers/orbit-verify maintain-verification-skill --run-id "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

  gate:
    # Marca minima en verde (~0 costo: sin checkout ni installs). En PR
    # borrador la bateria esta pausada y este job la da por pendiente; la
    # bateria corre sola al marcar listo para revision.
    runs-on: ubuntu-latest
    if: always()
    needs: [quality]
    timeout-minutes: 5
    steps:
      - name: Marca minima en verde
        env:
          R_QUALITY: ${{ needs.quality.result }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          rc=0
          for par in "quality=$R_QUALITY"; do
            printf '%s\n' "$par"
            case "$par" in
              *=success) ;;
              *=skipped)
                if [ "$DRAFT" = "true" ]; then
                  echo "gate: $par omitido, PR en borrador: la bateria corre al marcar listo para revision"
                else
                  echo "gate: $par omitido SIN borrador que lo autorice" >&2
                  rc=1
                fi ;;
              *)
                echo "gate: $par no quedo en success (fallo o cancelacion)" >&2
                rc=1 ;;
            esac
          done
          [ "$rc" -eq 0 ] || { echo "gate: RECHAZADO" >&2; exit 1; }
          echo "gate: OK"
