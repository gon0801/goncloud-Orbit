# Generado y mantenido por quality-kit (init-repo.ps1) -- QUALITY-KIT MANAGED.
# Si este archivo es EXACTAMENTE igual a lo que init-repo.ps1 generaria hoy
# para el stack detectado, es seguro de volver a generar cada vez que
# corre. Si le agregaste algo propio directo aca (una linea "exclude:", un
# comentario explicandola, un hook nuevo, args editados), init-repo.ps1 lo
# va a detectar y va a dejar el archivo tal cual esta, avisando -- nunca
# se pisa una personalizacion en silencio. Para sumar algo propio de forma
# permanente, agregalo directo en este archivo (no hace falta un archivo
# aparte: pre-commit no fusiona varios archivos de config de todas formas).
#
# Este bloque base (pre-commit-hooks) se incluye SIEMPRE, sin importar el
# stack detectado -- son chequeos genericos de higiene de archivo que
# tienen sentido en cualquier repo.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-json
      - id: check-yaml
# Fragmento Python (fusionado a mano desde templates/pre-commit-python.yaml
# del quality-kit: init-repo.ps1 preservo este archivo por el hook de
# repo-hygiene de abajo y no pisa personalizaciones).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
# pytest corre en PRE-PUSH, no en cada commit (fragmento
# templates/pre-commit-test-pytest.yaml del quality-kit).
#
# DECISION DEL DUENO 2026-08-29 — la bateria COMPLETA corre UNA vez y donde es
# barata: en CI (.github/workflows/quality.yml, paso "Run Python tests":
# `PYTHONPATH=. pytest -q` sobre TODO el repo, ~1.5-2 min en Linux). En esta
# maquina Windows la misma bateria cuesta ~6 min POR PUSH y se pagaba en cada
# vuelta de review: 17 pushes en un dia = ~1.7 h de duplicado puro. El candado
# NO se debilita, se MUEVE: aqui queda el subconjunto de GUARDAS que protegen
# la propia configuracion (arquitectura + hooks, ~1.5 s) y
# tests/test_precommit_hooks.py::test_bateria_completa_corre_en_ci pinea que CI
# siga corriendo la bateria entera. JAMAS se usa --no-verify.
  - repo: local
    hooks:
      - id: pytest-pre-push
        name: pytest rapido (pre-push; la bateria COMPLETA corre en CI)
        # El './' NO es cosmetico: sin el, CreateProcess rechaza la ruta
        # relativa con barras normales y el push muere con WinError 2
        # aunque el archivo exista (regresion: tests/test_precommit_hooks.py).
        entry: ./.venv/Scripts/python.exe -m pytest -x -q tests/test_architecture.py tests/test_precommit_hooks.py
        language: system
        pass_filenames: false
        stages: [pre-push]
# >>> QUALITY-KIT REPO-HYGIENE HOOK START -- managed by install-repo-hygiene.ps1
# Candado de capa de contexto: CLAUDE.md raiz <=200 lineas, anidados <=80,
# AGENTS.md <=400, sin diarios '## Estado anterior' (van a docs/).
# Sweep manual de basura: python tools/check_context_docs.py . --sweep
  - repo: local
    hooks:
      - id: context-docs-budget
        name: capa de contexto dentro de presupuesto (repo-hygiene)
        entry: python tools/check_context_docs.py
        language: system
        pass_filenames: false
        files: '(^|/)(CLAUDE|AGENTS|AGENT)\.md$'
# >>> QUALITY-KIT REPO-HYGIENE HOOK END
