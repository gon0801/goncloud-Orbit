[project]
name = "orbit"
version = "0.1.0"
description = "Orbit — optimizador de Amazon Ads y modulos de gestion e-commerce (Amazon + MeLi)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pglast>=6",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# Instalado y mantenido por quality-kit (install-repo-hygiene.ps1): no
# tocar su formato, re-correr el instalador lo restauraria.
extend-exclude = ["tools/check_context_docs.py"]

[tool.ruff.lint]
# C901/PLR0912/PLR0915: presupuesto de complejidad (plan guardrails-01, task
# 1.1). Limites = censo real del repo 2026-08-23 + margen chico (C901 max 20
# -> 22; branches max 23 -> 25; statements max 74 -> 80): cazan DERIVA
# futura, no fuerzan refactors del presente. Regla anti-Goodhart: si un
# candado dispara, se simplifica de verdad o se pone noqa CON razon que pasa
# por review -- JAMAS partir una funcion coherente solo para esquivar el
# numero (tres helpers sin sentido son peor codigo que un noqa justificado).
select = ["E", "F", "I", "UP", "B", "SIM", "C901", "PLR0912", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 22

[tool.ruff.lint.pylint]
max-branches = 25
max-statements = 80

[tool.ruff.lint.per-file-ignores]
# Los tests de integracion son guiones de escenario: largos y lineales por
# naturaleza; el riesgo de monolito vive en app/, no aqui.
"tests/*" = ["C901", "PLR0912", "PLR0915"]

[tool.pytest.ini_options]
testpaths = ["tests"]
