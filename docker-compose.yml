services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: orbit
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  # API + CLI (ORBIT 03 / 4.1). ADITIVO: el servicio db de arriba no se toca.
  # Bind SOLO en 127.0.0.1 (leccion 8055/8056). secrets/ se monta :ro;
  # user 0:0 = uid dueno de esos archivos (root 0600, ASI SE QUEDAN).
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    user: "0:0"
    environment:
      ORBIT_PG_HOST: db
      ORBIT_SECRETS_DIR: /mnt/data/appdata/orbit/secrets
    ports:
      - "127.0.0.1:8010:8000"
      # DASHBOARD 01 / 2.1: la IP de la interfaz WireGuard wg0 (10.13.13.1,
      # RFC1918 point-to-point — solo el host y los peers cifrados del tunel)
      # para ver el dashboard del cel por VPN. JAMAS todas las interfaces;
      # el candado test_compose_ningun_puerto_en_todas_las_interfaces sella
      # la allowlist exacta de hosts. Residual aceptado (header del plan):
      # la VPN demuestra "no publico", no "solo dueno" — todos los peers
      # wg0 son del dueno.
      - "10.13.13.1:8010:8000"
    volumes:
      - /mnt/data/appdata/orbit/secrets:/mnt/data/appdata/orbit/secrets:ro
    depends_on:
      - db

volumes:
  pgdata:
