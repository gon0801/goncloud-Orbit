services:
  db:
    image: postgres:16
    restart: unless-stopped
    # 4.1 (env por servicio): db ya NO hereda el .env completo (llevaba
    # hasta ORBIT_DSN_ADMIN). Solo POSTGRES_* por interpolacion del .env;
    # los DSN de Orbit viven unicamente en el servicio app.
    environment:
      POSTGRES_DB: orbit
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  # API + CLI (ORBIT 03 / 4.1). ADITIVO: el servicio db de arriba no se toca.
  # Bind SOLO en 127.0.0.1 (leccion 8055/8056). secrets/ se monta :ro;
  # user 10001:10001 = uid dueno de esos archivos en el server (4.1:
  # chown 10001:10001, perms 600/700 intactos — la app ya no es root).
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    user: "10001:10001"
    environment:
      ORBIT_PG_HOST: db
      ORBIT_SECRETS_DIR: /mnt/data/appdata/orbit/secrets
    ports:
      - "127.0.0.1:8010:8000"
      # DASHBOARD 01 / 2.1: la IP de la interfaz WireGuard wg0 (10.13.13.1,
      # RFC1918 point-to-point — solo el host y los peers cifrados del tunel)
      # para ver el dashboard del cel por VPN. JAMAS todas las interfaces;
      # el candado test_compose_ningun_puerto_en_todas_las_interfaces sella
      # la allowlist exacta de hosts. Residual aceptado (header del plan):
      # la VPN demuestra "no publico", no "solo dueno" — todos los peers
      # wg0 son del dueno.
      - "10.13.13.1:8010:8000"
    volumes:
      - /mnt/data/appdata/orbit/secrets:/mnt/data/appdata/orbit/secrets:ro
    depends_on:
      - db

volumes:
  pgdata:
